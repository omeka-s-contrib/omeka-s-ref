<title>omeka-s-ref</title>
<style>
:root { --bg: #ffffff; --fg: #1f2328; --link: #0969da; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d1117; --fg: #e6edf3; --link: #4493f8; }
}
body {
  background: var(--bg); color: var(--fg); margin: 0;
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 46rem; margin: 0 auto; padding: 2rem 16px; }

</style>
</head>
<body>
<main>
<h1>omeka-s-ref</h1>
<p>The <a href="ns">o-ref namespace</a> defines two terms, <code>o-ref:id</code> and
<code>o-ref:ref</code>, that identify and link Omeka S resources by a property value instead of by
internal id, so records can move between installations. Source:
<a href="https://github.com/omeka-s-contrib/omeka-s-ref">omeka-s-contrib/omeka-s-ref</a>.</p>
</main>
</body>
